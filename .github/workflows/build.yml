name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-plain-generic poppler-utils g++

      - name: Build the notebook
        run: make notebook

      - name: Check every header is imported
        run: |
          extra=$(make showexcluded | grep -v '^make\|^grep\|^find' | grep -v 'template.java' || true)
          if [ -n "$extra" ]; then
            echo "These headers are not imported by any chapter.tex:"; echo "$extra"; exit 1
          fi
          echo "All headers are imported."

      - name: Report page count
        id: pages
        run: |
          pages=$(pdfinfo notebook.pdf | awk '/^Pages:/{print $2}')
          echo "count=$pages" >> "$GITHUB_OUTPUT"
          echo "notebook.pdf is $pages pages" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$pages" -gt 25 ]; then
            echo "::warning::notebook.pdf is $pages pages, over the ICPC 25-page limit"
          fi

      - name: No content may overflow its column
        run: |
          # An overfull hbox wider than a few pt visibly crosses the column rule
          # and overlaps the neighbouring column. Tiny ones are imperceptible.
          bad=$(grep -o 'Overfull \\hbox ([0-9.]*pt too wide' build/notebook.log \
                | grep -o '[0-9.]*' | awk '$1 > 5' | wc -l | tr -d ' ')
          total=$(grep -c 'Overfull .hbox' build/notebook.log || true)
          echo "overfull boxes: $total total, $bad wider than 5pt"
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad box(es) overflow the column by more than 5pt"
            grep -n 'Overfull .hbox' build/notebook.log | head -20
            exit 1
          fi

      - name: Every snippet must compile standalone
        run: ./scripts/test-compiles.sh

      - uses: actions/upload-artifact@v4
        with:
          name: notebook
          path: notebook.pdf

      - name: Publish the PDF to the rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d).
          ${{ steps.pages.outputs.count }} pages.

          Always the current build of main. Download: \`notebook.pdf\` below."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest build" --notes "$notes" notebook.pdf
          else
            gh release edit latest --notes "$notes"
            gh release upload latest notebook.pdf --clobber
          fi
          echo "PDF: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/notebook.pdf" \
            | tee -a "$GITHUB_STEP_SUMMARY"
