name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-plain-generic poppler-utils

      - name: Build the notebook
        run: make notebook

      - name: Check every header is imported
        run: |
          extra=$(make showexcluded | grep -v '^make\|^grep\|^find' | grep -v 'template.java' || true)
          if [ -n "$extra" ]; then
            echo "These headers are not imported by any chapter.tex:"; echo "$extra"; exit 1
          fi
          echo "All headers are imported."

      - name: Report page count
        id: pages
        run: |
          pages=$(pdfinfo notebook.pdf | awk '/^Pages:/{print $2}')
          echo "count=$pages" >> "$GITHUB_OUTPUT"
          echo "notebook.pdf is $pages pages" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$pages" -gt 25 ]; then
            echo "::warning::notebook.pdf is $pages pages, over the ICPC 25-page limit"
          fi

      - name: Advisory standalone-compile report (non-blocking)
        continue-on-error: true
        run: |
          # These snippets are fragments meant to be pasted into a solution, not
          # standalone translation units. This reports; it never gates.
          # See docs/known-issues.md.
          TMP=$(mktemp -d)
          sed -e '/^#pragma GCC/d' -e '/^void solve/,$d' content/contest/template.cpp > "$TMP/prelude.h"
          pass=0; fail=0; : > "$TMP/failing"
          for h in $(find content -name '*.h' | sort); do
            { cat "$TMP/prelude.h"; echo "#include \"$PWD/$h\""; echo "int main(){}"; } > "$TMP/tu.cpp"
            if g++ -std=c++20 -fsyntax-only -w "$TMP/tu.cpp" 2>/dev/null; then
              pass=$((pass+1))
            else
              fail=$((fail+1)); echo "- \`$h\`" >> "$TMP/failing"
            fi
          done
          { echo "### Standalone compile report";
            echo "$pass compile standalone, $fail do not.";
            echo; echo "<details><summary>Not standalone</summary>"; echo;
            cat "$TMP/failing"; echo; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: notebook
          path: notebook.pdf

      - name: Publish the PDF to the rolling "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d).
          ${{ steps.pages.outputs.count }} pages.

          Always the current build of main. Download: \`notebook.pdf\` below."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest build" --notes "$notes" notebook.pdf
          else
            gh release edit latest --notes "$notes"
            gh release upload latest notebook.pdf --clobber
          fi
          echo "PDF: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/notebook.pdf" \
            | tee -a "$GITHUB_STEP_SUMMARY"
